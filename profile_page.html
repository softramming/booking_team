		<title>Profile page</title>
		<style>
			*{
				margin:0;
				font-family:sans-serif;
				box-sizing:border-box;
			}
			body{
				background: #f5f4fa;
			}
			.sub_parent{
				max-width:800px;
				width:100%;
				margin:10px auto;
				background: #E6E6FA;
				display:block;
				border-radius:12px;
				padding:20px 60px;
			}
			.profile_pic{
				background-color:#fff;
				width:100px;
				hight:100px;
				border-radius: 50%;
				border:1px solid #333;
				padding: 40px;

			}
			.profile{
				display:grid;
				grid-template-columns: repeat(1, 1fr);
				gap:10px;
				margin: 20px;
				border-radius: 12px;
			}
			.child{
				margin:10px;
				text-align: left;
				padding:8px;
				background-color: #fff;
				border-radius: 12px;
			}
			.flex_1{

				gap:20px;
			}
		</style>

				<div class="child"><i class="fa fa-cogs"></i>&nbsp Setting</div>

				<div class="child"><i class="fa fa-check"></i>&nbsp Testimonial</div>

			</div>
		</center>
